
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Durga Drawing Animation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600;1,700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      box-sizing: border-box;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto auto auto auto;
      justify-items: center;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      padding: 10px;
      text-align: center;
      font-family: Arial, sans-serif;
      background: #fff8ed;
      color: #672525;
    }

    h1 {
      margin: 0;
    }

    canvas {
      display: block;
      width: auto;
      height: auto;
      max-width: min(90vw, 600px);
      max-height: 100%;
      margin: 4px auto;
      border: 2px solid #d6a45d;
      background: #090909;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: #a52a2a;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin: 4px auto 0;
    }

    audio {
      display: block;
      width: min(280px, 90vw);
      height: 40px;
      margin: 4px auto;
    }

    .social-link {
      display: grid;
      width: 42px;
      aspect-ratio: 1;
      place-items: center;
      border: 1px solid #d6a45d;
      border-radius: 50%;
      background: white;
    }

    .social-link img {
      display: block;
      width: 22px;
      height: 22px;
    }

    .social-link:focus-visible {
      outline: 3px solid #672525;
      outline-offset: 3px;
    }

    .status-line {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
      color: #672525;
      margin: 4px 0;
    }

    .status-separator {
      color: #d6a45d;
    }

    .credit {
      margin: 4px 0;
      color: #672525;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 18px;
      font-style: italic;
      font-weight: 700;
    }

    @media (max-width: 600px) {
      body {
        height: auto;
        min-height: 100dvh;
        grid-template-rows: auto auto auto auto auto auto auto;
        align-content: start;
        overflow-y: auto;
      }

      canvas {
        box-sizing: border-box;
        max-width: calc(100vw - 20px);
        max-height: none;
      }
    }
  </style>
</head>

<body>
  <h1>Happy Dussehra!</h1>
  <p class="status-line">
    <span id="message">Preparing Durga drawing...</span>
    <span class="status-separator" aria-hidden="true">|</span>
    <span id="musicStatus">Music preparing...</span>
  </p>

  <canvas id="drawingCanvas"></canvas>
  <p class="credit">Designed by Bhuvan</p>
  <button id="drawButton" onclick="toggleMusic()" disabled>Preparing drawing...</button>
  <audio id="durgaSong" controls loop preload="auto" aria-label="Durga song">
    <source src="durga_song.mp3" type="audio/mpeg">
    Your browser does not support audio playback.
  </audio>
  <nav class="social-links" aria-label="Bhuvan's social profiles">
    <a class="social-link" href="https://www.linkedin.com/in/bhuvan2004/?isSelfProfile=true" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn" title="LinkedIn">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#0A66C2" d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.35V9h3.414v1.561h.049c.476-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.063 2.064 2.064 0 1 1 2.063 2.063zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
      </svg>
    </a>
    <a class="social-link" href="https://www.instagram.com/eswar__2004/" target="_blank" rel="noopener noreferrer" aria-label="Instagram" title="Instagram">
      <img src="https://cdn.simpleicons.org/instagram/E4405F" alt="">
    </a>
    <a class="social-link" href="https://github.com/chandra1414" target="_blank" rel="noopener noreferrer" aria-label="GitHub" title="GitHub">
      <img src="https://cdn.simpleicons.org/github/181717" alt="">
    </a>
  </nav>

  <img id="sourceImage" src="durga.jpg" hidden>

  <script async src="https://docs.opencv.org/4.x/opencv.js"></script>

  <script>
    const canvas = document.getElementById("drawingCanvas");
    const ctx = canvas.getContext("2d");
    const img = document.getElementById("sourceImage");
    const message = document.getElementById("message");
    const musicStatus = document.getElementById("musicStatus");
    const song = document.getElementById("durgaSong");

    let drawingLines = [];
    let lineIndex = 0;
    let pointIndex = 1;
    let animationStarted = false;
    let autoplayBlocked = false;

    song.addEventListener("play", () => {
      autoplayBlocked = false;
      musicStatus.textContent = "Music playing.";
      document.getElementById("drawButton").textContent = "Pause Music";
    });

    song.addEventListener("pause", () => {
      musicStatus.textContent = "Music paused.";
      document.getElementById("drawButton").textContent = autoplayBlocked
        ? "Enable Music"
        : "Play Music";
    });

    // Wait until OpenCV.js is ready
    async function waitForOpenCV() {
      while (!window.cv || !window.cv.Mat) {
        await new Promise(resolve => setTimeout(resolve, 100));
      }
    }

    img.onload = async function () {
      await waitForOpenCV();
      prepareDrawing();
    };

    img.onerror = function () {
      message.textContent =
        "Image not found. Check that durga.jpg is in this folder.";
    };

    async function prepareDrawing() {
      message.textContent = "Preparing image outline...";

      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;

      let source, gray, blurred, edges, contours, hierarchy;

      try {
        source = cv.imread(img);
        gray = new cv.Mat();
        blurred = new cv.Mat();
        edges = new cv.Mat();
        contours = new cv.MatVector();
        hierarchy = new cv.Mat();

        cv.cvtColor(source, gray, cv.COLOR_RGBA2GRAY);
        cv.GaussianBlur(
          gray, blurred, new cv.Size(5, 5), 0
        );
        cv.Canny(blurred, edges, 60, 150);

        cv.findContours(
          edges, contours, hierarchy,
          cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE
        );

        drawingLines = [];

        for (let i = 0; i < contours.size(); i++) {
          const contour = contours.get(i);

          if (cv.arcLength(contour, false) >= 20) {
            const points = [];

            for (let j = 0; j < contour.data32S.length; j += 2) {
              points.push({
                x: contour.data32S[j],
                y: contour.data32S[j + 1]
              });
            }

            if (points.length > 1) {
              drawingLines.push(points);
            }
          }

          contour.delete();
        }

        // Draw contours starting from higher parts of the image
        drawingLines.sort((a, b) => {
          const topA = Math.min(...a.map(p => p.y));
          const topB = Math.min(...b.map(p => p.y));
          return topA - topB;
        });

        const drawButton = document.getElementById("drawButton");
        drawButton.disabled = false;
        drawButton.textContent = "Pause Music";
        startDrawing();
        playSong();
      } catch (error) {
        message.textContent =
          "Could not process image. Please refresh and try again.";
        console.error(error);
      } finally {
        if (source) source.delete();
        if (gray) gray.delete();
        if (blurred) blurred.delete();
        if (edges) edges.delete();
        if (contours) contours.delete();
        if (hierarchy) hierarchy.delete();
      }
    };

    function startDrawing() {
      if (drawingLines.length === 0 || animationStarted) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = "#f4c95d";
      ctx.lineWidth = 1.5;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      lineIndex = 0;
      pointIndex = 1;
      animationStarted = true;
      message.textContent = "Drawing started...";

      requestAnimationFrame(drawFrame);
    }

    function playSong() {
      song.play().then(() => {
        autoplayBlocked = false;
        document.getElementById("drawButton").textContent = "Pause Music";
      }).catch(() => {
        autoplayBlocked = true;
        document.getElementById("drawButton").textContent = "Enable Music";
        musicStatus.textContent = "Autoplay blocked. Tap Enable Music to start the song.";
      });
    }

    function toggleMusic() {
      const drawButton = document.getElementById("drawButton");

      if (!song.paused) {
        song.pause();
        drawButton.textContent = "Play Music";
        return;
      }

      playSong();
    }

    function drawFrame() {
      if (!animationStarted) return;

      let pointsDrawn = 0;

      // Larger number means faster drawing
      while (pointsDrawn < 15 && lineIndex < drawingLines.length) {
        const points = drawingLines[lineIndex];

        if (pointIndex === 1) {
          ctx.beginPath();
          ctx.moveTo(points[0].x, points[0].y);
        }

        const end = Math.min(pointIndex + 1, points.length - 1);

        for (let i = pointIndex; i <= end; i++) {
          ctx.lineTo(points[i].x, points[i].y);
        }

        ctx.stroke();
        pointIndex = end + 1;
        pointsDrawn++;

        if (pointIndex >= points.length) {
          lineIndex++;
          pointIndex = 1;
        }
      }

      if (lineIndex < drawingLines.length) {
        message.textContent = "Drawing continues...";
        requestAnimationFrame(drawFrame);
      } else {
        message.textContent = "Drawing completed!";
        animationStarted = false;
      }
    }
  </script>
</body>
</html>
